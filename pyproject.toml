[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-turbomem"
version = "0.1.0"
description = "Local MCP persistent memory for Hermes: TurboQuant vectors + unified recall over experiences and code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BaoAL31" }]
dependencies = [
  "mcp>=1.6.0",
  "numpy>=1.26.0",
  "sentence-transformers>=3.0.0",
  "turbovec>=0.1.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
index = [
  "tree-sitter>=0.24.0",
  "tree-sitter-languages>=1.10.0",
  "pathspec>=0.10.0",
]

[project.scripts]
hermes-turbomem = "hermes_turbomem.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_turbomem"]

[tool.hatch.build.targets.sdist]
include = ["src/hermes_turbomem"]
