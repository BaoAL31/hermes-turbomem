[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-turbomem"
version = "0.1.0"
description = "Local Hermes memory provider: TurboQuant vectors + hybrid recall over experiences and code. No cloud API required."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BaoAL31" }]
dependencies = [
  "mcp>=1.6.0",
  "numpy>=1.26.0",
  "sentence-transformers>=3.0.0",
  "turbovec>=0.1.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
index = [
  "tree-sitter>=0.24.0",
  "tree-sitter-languages>=1.10.0",
]
dev = [
  "pytest>=8.0.0",
  "huggingface-hub>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "plugins/memory"]

[project.scripts]
hermes-turbomem = "hermes_turbomem.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_turbomem"]

[tool.hatch.build.targets.sdist]
include = ["src/hermes_turbomem"]
